<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechCompare — 5종 IT 기기 랜덤 3D 트리오 전환 예시 (3d_hero_demo.html)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050a14;
      --surface: rgba(13, 21, 32, 0.85);
      --border: rgba(255, 255, 255, 0.10);
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --accent: #38BDF8;
      --accent-strong: #0EA5E9;
      --badge-bg: rgba(56, 189, 248, 0.12);
      --badge-text: #7DD3FC;
      --emerald: #34D399;
      --rays: radial-gradient(ellipse 65% 65% at 50% 0%, rgba(14, 165, 233, 0.34), rgba(56, 189, 248, 0.08) 48%, transparent 76%);
    }

    [data-theme="white"] {
      --bg: #EBF1F8;
      --surface: rgba(255, 255, 255, 0.90);
      --border: rgba(15, 23, 42, 0.10);
      --text-main: #0F172A;
      --text-sub: #475569;
      --accent: #0A84FF;
      --accent-strong: #0070E0;
      --badge-bg: rgba(10, 132, 255, 0.10);
      --badge-text: #0A84FF;
      --emerald: #059669;
      --rays: radial-gradient(ellipse 65% 65% at 50% 0%, rgba(10, 132, 255, 0.22), rgba(56, 189, 248, 0.08) 48%, transparent 76%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.25s ease;
    }
    .tech-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 32px), 1160px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
    .brand__dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 12px var(--accent);
    }
    .topbar__right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-btn {
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-main); font-family: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer; text-decoration: none; transition: border-color 0.2s, color 0.2s;
    }
    .pill-btn:hover { border-color: var(--accent); color: var(--accent); }
    .fps-pill {
      padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 800;
      color: var(--emerald); background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    /* Hero Stage (Matches ide.html 3-Phone Trophy Layout) */
    .hero {
      position: relative;
      min-height: 100vh;
      padding: 104px 20px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--rays);
      pointer-events: none;
      z-index: 0;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 820px;
    }
    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .hero__title {
      font-size: clamp(30px, 3.6vw + 12px, 54px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }
    .hero__title .accent { color: var(--accent); }
    .hero__desc {
      margin-top: 12px;
      font-size: 15px;
      color: var(--text-sub);
      max-width: 58ch;
      margin-inline: auto;
      line-height: 1.55;
    }

    /* 3-Slot 3D Trophy Stage */
    .trophy-stage {
      position: relative;
      z-index: 2;
      margin-top: 10px;
      width: 100%;
      max-width: 1140px;
      height: clamp(420px, 58vh, 560px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
    }
    .trophy-stage:active { cursor: grabbing; }
    #hero3dCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .trophy-podium-glow {
      position: absolute;
      bottom: 24px;
      width: min(82vw, 740px);
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 150, 255, 0.45) 0%, rgba(0, 150, 255, 0.12) 52%, transparent 76%);
      transform: rotateX(76deg);
      filter: blur(12px);
      pointer-events: none;
    }
    [data-theme="white"] .trophy-podium-glow {
      background: radial-gradient(ellipse at center, rgba(10, 132, 255, 0.25) 0%, rgba(56, 189, 248, 0.10) 52%, transparent 76%);
    }

    /* Current Active Trio Indicator */
    .trio-status {
      position: relative;
      z-index: 2;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .slot-chip {
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      transition: transform 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    .slot-chip.is-center {
      border-color: var(--accent);
      color: var(--text-main);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand__dot"></span>
      <span>TechCompare · 8종 랜덤 3D 히어로 예시</span>
    </div>
    <div class="topbar__right">
      <span class="fps-pill tech-mono" id="fpsCounter">60 FPS</span>
      <button class="pill-btn" id="nextTrioBtn">다음 랜덤 3종 ↻</button>
      <button class="pill-btn" id="pauseBtn">자동전환 ON</button>
      <button class="pill-btn" id="themeBtn">라이트 모드</button>
      <a href="./3d.html" class="pill-btn">3d.html</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero__content">
      <div class="hero__badge tech-mono">
        <span>8 DEVICES (3 PHONES + 5 IT) · RANDOM 3-SLOT STAGE · ZERO-LAG 60FPS</span>
      </div>
      <h1 class="hero__title">
        기존 스마트폰 3종 + 5대 IT 기기가<br />
        <span class="accent">랜덤 3종 트리오</span>로 교차 등장합니다
      </h1>
      <p class="hero__desc">
        기존 플래그십 스마트폰 3종과 노트북 · 에어팟 케이스 · 티타늄 워치 · 헤드셋 · 태블릿 5종(총 8종)이 동일한 히어로 비율로 3개씩 랜덤으로 슥 들어왔다가 다음 조합으로 교체됩니다.
      </p>
    </div>

    <div class="trophy-stage" id="trophyStage" title="드래그하여 3D 모델 360° 회전">
      <div class="trophy-podium-glow"></div>
      <canvas id="hero3dCanvas"></canvas>
    </div>

    <div class="trio-status tech-mono" id="trioStatus">
      <span class="slot-chip" id="chip0">LEFT: -</span>
      <span class="slot-chip is-center" id="chip1">CENTER: -</span>
      <span class="slot-chip" id="chip2">RIGHT: -</span>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // Theme toggle
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      const isWhite = document.documentElement.getAttribute('data-theme') === 'white';
      if (isWhite) {
        document.documentElement.removeAttribute('data-theme');
        themeBtn.textContent = '라이트 모드';
      } else {
        document.documentElement.setAttribute('data-theme', 'white');
        themeBtn.textContent = '다크 모드';
      }
      syncRingTheme();
    });

    const stageEl = document.getElementById('trophyStage');
    const canvas = document.getElementById('hero3dCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.24;

    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 80);
    camera.position.set(0, 0.55, 9.6);
    camera.lookAt(0, -0.05, 0);

    // Studio Lighting (Zero-Lag)
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(3.2, 7.5, 5.5);
    const rimLeft = new THREE.DirectionalLight(0x38bdf8, 1.35);
    rimLeft.position.set(-5.0, 2.5, -3.5);
    const rimRight = new THREE.DirectionalLight(0x818cf8, 1.1);
    rimRight.position.set(5.0, 2.0, -3.0);
    scene.add(keyLight, rimLeft, rimRight, new THREE.AmbientLight(0xe0f2fe, 0.65));

    // Subtle Podium Double Light Rings (Matching ide.html)
    const trophyGroup = new THREE.Group();
    scene.add(trophyGroup);

    const ringMat = new THREE.MeshBasicMaterial({ color: 0x0096ff, transparent: true, opacity: 0.55 });
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(3.05, 0.020, 14, 96), ringMat);
    outerRing.rotation.x = Math.PI / 2;
    outerRing.position.y = -2.02;
    trophyGroup.add(outerRing);

    const innerRingMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.38 });
    const innerRing = new THREE.Mesh(new THREE.TorusGeometry(2.05, 0.015, 14, 72), innerRingMat);
    innerRing.rotation.x = Math.PI / 2;
    innerRing.position.y = -1.96;
    trophyGroup.add(innerRing);

    function syncRingTheme() {
      const isWhite = document.documentElement.getAttribute('data-theme') === 'white';
      ringMat.color.setHex(isWhite ? 0x0a84ff : 0x0096ff);
      ringMat.opacity = isWhite ? 0.38 : 0.55;
      innerRingMat.color.setHex(isWhite ? 0x0284c7 : 0x7dd3fc);
      innerRingMat.opacity = isWhite ? 0.28 : 0.38;
      renderer.toneMappingExposure = isWhite ? 1.32 : 1.24;
    }

    // Shared Geometry & Procedural Texture Helpers
    function roundedShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

    function beveledBody(w, h, depth, radius, bevel = 0.025, segs = 5) {
      const geo = new THREE.ExtrudeGeometry(roundedShape(w, h, radius), {
        depth, bevelEnabled: true, bevelSegments: segs, steps: 1, bevelSize: bevel, bevelThickness: bevel
      });
      geo.center();
      return geo;
    }

    function makeScreenTex(drawFn, size = 1024) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      drawFn(ctx, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function makeKnitTexture(baseHex, lineHex) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = lineHex;
      ctx.lineWidth = 1.5;
      for (let i = -128; i < 256; i += 8) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 128, 128); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i + 128, 0); ctx.lineTo(i, 128); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 6);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function normalizeModel(obj, targetSize = 2.0) {
      const wrapper = new THREE.Group();
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3(), center = new THREE.Vector3();
      box.getSize(size); box.getCenter(center);
      const scale = targetSize / (Math.max(size.x, size.y, size.z) || 1);
      obj.scale.setScalar(scale);
      obj.position.sub(center.multiplyScalar(scale));
      wrapper.add(obj);
      return wrapper;
    }

    // ── Build All 5 High-Craft Models ONCE (Zero-Lag Prebuild) ──
    function createLaptopModel() {
      const g = new THREE.Group();
      const alu = new THREE.MeshStandardMaterial({ color: 0x3b4454, metalness: 0.90, roughness: 0.22, envMapIntensity: 1.4 });
      const base = new THREE.Mesh(beveledBody(1.9, 1.32, 0.038, 0.08, 0.015, 4), alu);
      base.rotation.x = Math.PI / 2;
      const tp = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.42), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35, metalness: 0.3 }));
      tp.rotation.x = -Math.PI / 2; tp.position.set(0, 0.036, 0.38);
      const kbRecess = new THREE.Mesh(new THREE.PlaneGeometry(1.56, 0.56), new THREE.MeshBasicMaterial({ color: 0x090d16 }));
      kbRecess.rotation.x = -Math.PI / 2; kbRecess.position.set(0, 0.0355, -0.15);
      const keyGeo = new THREE.BoxGeometry(0.092, 0.014, 0.082);
      const keys = new THREE.InstancedMesh(keyGeo, new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 }), 65);
      const dummy = new THREE.Object3D();
      let idx = 0;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 13; c++) {
          dummy.position.set(-0.69 + c * 0.115, 0.041, -0.37 + r * 0.105);
          dummy.scale.set(r === 4 && c === 6 ? 2.4 : 1, 1, 1);
          dummy.updateMatrix();
          keys.setMatrixAt(idx++, dummy.matrix);
        }
      }
      keys.instanceMatrix.needsUpdate = true;
      g.add(base, tp, kbRecess, keys);

      const lid = new THREE.Group();
      lid.position.set(0, 0.02, -0.64);
      lid.rotation.x = -0.30;
      const lidShell = new THREE.Mesh(beveledBody(1.9, 1.24, 0.024, 0.08, 0.012, 4), alu);
      lidShell.position.y = 0.64;
      const lapTex = makeScreenTex((ctx, w, h) => {
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#090d16'); grad.addColorStop(1, '#0c4a6e');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(48, 48, w - 96, 68);
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 34px sans-serif'; ctx.fillText('MacBook Pro · Studio', 78, 94);
        ctx.fillStyle = 'rgba(56,189,248,0.18)'; ctx.fillRect(48, 150, 440, 260);
        ctx.fillStyle = 'rgba(52,211,153,0.18)'; ctx.fillRect(520, 150, 456, 260);
      });
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.78, 1.12), new THREE.MeshStandardMaterial({ map: lapTex, roughness: 0.05, emissive: 0x0c4a6e, emissiveIntensity: 0.25 }));
      scr.position.set(0, 0.64, 0.026);
      lid.add(lidShell, scr);
      g.add(lid);
      return normalizeModel(g, 3.05);
    }

    function createAirpodsModel() {
      const g = new THREE.Group();
      const ceramic = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.08, metalness: 0.04, envMapIntensity: 1.5 });
      const chrome = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.12, metalness: 0.96, envMapIntensity: 1.55 });
      const caseBody = new THREE.Mesh(beveledBody(1.42, 0.94, 0.42, 0.28, 0.12, 8), ceramic);
      const seam = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.012, 0.58), new THREE.MeshBasicMaterial({ color: 0x64748b }));
      seam.position.y = 0.22;
      const thumbLip = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.045, 0.03), chrome);
      thumbLip.position.set(0, 0.21, 0.325);
      const led = new THREE.Mesh(new THREE.CircleGeometry(0.022, 16), new THREE.MeshBasicMaterial({ color: 0x34d399 }));
      led.position.set(0, 0.04, 0.333);
      const hinge = new THREE.Mesh(beveledBody(0.56, 0.14, 0.025, 0.04, 0.01, 4), chrome);
      hinge.position.set(0, 0.22, -0.325);
      const usbc = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.09), new THREE.MeshBasicMaterial({ color: 0x0f172a }));
      usbc.position.set(0, -0.59, 0);
      const lanyard = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.015, 10, 20), chrome);
      lanyard.position.set(0.84, 0.06, 0);
      g.add(caseBody, seam, thumbLip, led, hinge, usbc, lanyard);
      return normalizeModel(g, 2.30);
    }

    function createWatchModel() {
      const g = new THREE.Group();
      const ti = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.92, roughness: 0.20, envMapIntensity: 1.5 });
      const strapMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.65, metalness: 0.05 });
      const strapPts = [];
      for (let i = 0; i <= 24; i++) {
        const a = (i / 24) * Math.PI * 1.48 - Math.PI * 0.74;
        strapPts.push(new THREE.Vector3(0, Math.sin(a) * 1.02, Math.cos(a) * 0.64 - 0.56));
      }
      const bandMesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(strapPts), 32, 0.22, 12, false), strapMat);
      bandMesh.scale.set(1.65, 1.0, 0.32);
      g.add(bandMesh);

      const caseBody = new THREE.Mesh(beveledBody(0.92, 1.12, 0.16, 0.24, 0.045, 6), ti);
      caseBody.position.z = 0.08;
      const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.11, 20), ti);
      crown.rotation.z = Math.PI / 2; crown.position.set(0.54, 0.18, 0.08);
      const sideBtn = new THREE.Mesh(beveledBody(0.04, 0.24, 0.07, 0.015, 0.01, 3), ti);
      sideBtn.position.set(0.51, -0.16, 0.08);
      const actionBtn = new THREE.Mesh(beveledBody(0.04, 0.28, 0.07, 0.015, 0.01, 3), new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3 }));
      actionBtn.position.set(-0.51, 0.02, 0.08);
      g.add(caseBody, crown, sideBtn, actionBtn);

      const watchTex = makeScreenTex((ctx, w, h) => {
        ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 22; ctx.beginPath(); ctx.arc(512, 512, 340, -1.5, 2.3); ctx.stroke();
        ctx.strokeStyle = '#34d399'; ctx.lineWidth = 22; ctx.beginPath(); ctx.arc(512, 512, 290, -1.5, 3.1); ctx.stroke();
        ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 148px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('10:09', 512, 540);
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 34px monospace'; ctx.fillText('TITANIUM · 49MM', 512, 625);
      });
      const scrGeo = new THREE.ShapeGeometry(roundedShape(0.76, 0.96, 0.17));
      const pos = scrGeo.attributes.position;
      const uvs = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        uvs[i * 2] = (pos.getX(i) + 0.38) / 0.76;
        uvs[i * 2 + 1] = (pos.getY(i) + 0.48) / 0.96;
      }
      scrGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      const scr = new THREE.Mesh(scrGeo, new THREE.MeshStandardMaterial({ map: watchTex, roughness: 0.05, envMapIntensity: 1.5, emissive: 0x0c4a6e, emissiveIntensity: 0.25 }));
      scr.position.z = 0.207;
      g.add(scr);
      return normalizeModel(g, 2.85);
    }

    function createHeadsetModel() {
      const g = new THREE.Group();
      const steel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.98, roughness: 0.09, envMapIntensity: 1.6 });
      const aluCup = new THREE.MeshStandardMaterial({ color: 0x3b4454, metalness: 0.90, roughness: 0.22, envMapIntensity: 1.5 });
      const knitTex = makeKnitTexture('#1e293b', '#475569');
      const knitMat = new THREE.MeshStandardMaterial({ map: knitTex, roughness: 0.85, metalness: 0.02 });

      const railCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.84, 0.34, 0), new THREE.Vector3(-0.68, 0.96, 0),
        new THREE.Vector3(0, 1.24, 0), new THREE.Vector3(0.68, 0.96, 0), new THREE.Vector3(0.84, 0.34, 0)
      ]);
      [-0.085, 0.085].forEach(z => {
        const rail = new THREE.Mesh(new THREE.TubeGeometry(railCurve, 32, 0.022, 10, false), steel);
        rail.position.z = z;
        g.add(rail);
      });
      const canopy = new THREE.Mesh(new THREE.TubeGeometry(railCurve, 32, 0.09, 12, false), knitMat);
      canopy.scale.set(1, 0.32, 1.12);
      g.add(canopy);

      [-1, 1].forEach(side => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.42, 14), steel);
        arm.position.set(side * 0.87, 0.16, 0); arm.rotation.z = side * 0.12;
        const pivot = new THREE.Mesh(new THREE.SphereGeometry(0.042, 14, 12), steel);
        pivot.position.set(side * 0.89, -0.02, 0);
        const cupGroup = new THREE.Group();
        cupGroup.position.set(side * 0.86, -0.32, 0);
        cupGroup.rotation.z = side * -0.05;
        const cup = new THREE.Mesh(beveledBody(0.56, 0.78, 0.16, 0.26, 0.045, 5), aluCup);
        cup.rotation.y = Math.PI / 2;
        const cushion = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.105, 16, 36), knitMat);
        cushion.rotation.y = Math.PI / 2; cushion.scale.set(1.0, 1.32, 1.0);
        cushion.position.x = -side * 0.14;
        cupGroup.add(cup, cushion);
        if (side === 1) {
          const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.05, 16), steel);
          crown.rotation.z = Math.PI / 2; crown.position.set(0.10, 0.26, -0.10);
          cupGroup.add(crown);
        }
        g.add(arm, pivot, cupGroup);
      });
      return normalizeModel(g, 2.95);
    }

    function createTabletModel() {
      const g = new THREE.Group();
      const alu = new THREE.MeshStandardMaterial({ color: 0x3b4454, metalness: 0.90, roughness: 0.20, envMapIntensity: 1.5 });
      const chrome = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.98, roughness: 0.08, envMapIntensity: 1.55 });
      const pencilMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.04, roughness: 0.12, envMapIntensity: 1.35 });
      g.add(new THREE.Mesh(beveledBody(1.52, 1.98, 0.026, 0.09, 0.015, 5), alu));
      const glassBezel = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(1.48, 1.94, 0.078)), new THREE.MeshBasicMaterial({ color: 0x050810 }));
      glassBezel.position.z = 0.0285;
      g.add(glassBezel);

      const tabTex = makeScreenTex((ctx, w, h) => {
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#09111f'); grad.addColorStop(0.55, '#0c4a6e'); grad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(54, 62, w - 108, 72);
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 34px sans-serif'; ctx.fillText('iPad Pro M4 · Tandem OLED', 86, 110);
        ctx.fillStyle = 'rgba(15,23,42,0.68)'; ctx.fillRect(54, 166, w - 108, 520);
        ctx.strokeStyle = '#34d399'; ctx.lineWidth = 10; ctx.beginPath();
        ctx.moveTo(100, 600); ctx.bezierCurveTo(280, 320, 560, 520, 880, 240); ctx.stroke();
      });
      const scrGeo = new THREE.ShapeGeometry(roundedShape(1.38, 1.84, 0.058));
      const pos = scrGeo.attributes.position;
      const uvs = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        uvs[i * 2] = (pos.getX(i) + 0.69) / 1.38;
        uvs[i * 2 + 1] = (pos.getY(i) + 0.92) / 1.84;
      }
      scrGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      const scr = new THREE.Mesh(scrGeo, new THREE.MeshStandardMaterial({ map: tabTex, roughness: 0.04, envMapIntensity: 1.5, emissive: 0x0c4a6e, emissiveIntensity: 0.24 }));
      scr.position.z = 0.0295;
      g.add(scr);

      const camBump = new THREE.Mesh(beveledBody(0.30, 0.30, 0.018, 0.055, 0.009, 4), alu);
      camBump.position.set(-0.50, 0.72, -0.033);
      const lensRing = new THREE.Mesh(new THREE.CylinderGeometry(0.064, 0.064, 0.024, 24), chrome);
      lensRing.rotation.x = Math.PI / 2; lensRing.position.set(-0.55, 0.77, -0.045);
      const pencilGroup = new THREE.Group();
      pencilGroup.position.set(0.818, 0.04, 0);
      pencilGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 1.28, 20), pencilMat));
      const pTip = new THREE.Mesh(new THREE.ConeGeometry(0.034, 0.13, 20), pencilMat);
      pTip.rotation.x = Math.PI; pTip.position.y = -0.725;
      pencilGroup.add(pTip);
      g.add(camBump, lensRing, pencilGroup);
      return normalizeModel(g, 3.25);
    }

    // ── Existing 3 Flagship Smartphones (Exact ide.html Trophy Models) ──
    function createOLEDTexture(palette, isUltra = false) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 1024;
      const ctx = c.getContext('2d');
      const bg = ctx.createLinearGradient(0, 0, 512, 1024);
      bg.addColorStop(0, palette[0]); bg.addColorStop(0.48, palette[1]); bg.addColorStop(1, palette[2]);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 1024);

      for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.translate(256, 440 + i * 70);
        ctx.rotate((i - 1.5) * 0.28);
        const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 290);
        g.addColorStop(0, palette[3]); g.addColorStop(0.5, palette[4]); g.addColorStop(1, 'transparent');
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 280, 130, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let b = 0; b < 4; b++) ctx.fillRect(382 + b * 8, 52 - b * 3, 5, 8 + b * 3);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5;
      ctx.strokeRect(426, 42, 36, 17); ctx.fillRect(429, 45, 27, 11);
      ctx.fillStyle = 'rgba(226,232,240,0.85)'; ctx.font = '600 22px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('THU · NOV 12', 256, 162);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = isUltra ? '800 116px Inter, sans-serif' : '800 124px Inter, sans-serif';
      ctx.fillText('09:41', 256, 275);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.strokeStyle = 'rgba(255,255,255,0.24)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(86, 318, 158, 68, 22); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(264, 318, 80, 68, 22); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(358, 318, 68, 68, 22); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(102, 916, 30, 0, Math.PI * 2); ctx.arc(410, 916, 30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.beginPath(); ctx.roundRect(176, 986, 160, 10, 5); ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
      return tex;
    }

    function createSmartphone3D({ w = 1.68, h = 3.48, depth = 0.165, radius = 0.25, frameColor = 0xcbd5e1, backColor = 0x1e293b, style = 'iphone', wallpaperPalette }) {
      const group = new THREE.Group();
      const bodyGeo = new THREE.ExtrudeGeometry(roundedShape(w, h, radius), {
        depth, bevelEnabled: true, bevelSegments: 6, steps: 1, bevelSize: 0.034, bevelThickness: 0.034
      });
      bodyGeo.center();
      const frameMat = new THREE.MeshStandardMaterial({ color: frameColor, metalness: 0.94, roughness: 0.20, envMapIntensity: 1.5 });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 1.0, roughness: 0.08, envMapIntensity: 1.55 });
      const backMat = new THREE.MeshStandardMaterial({ color: backColor, metalness: 0.42, roughness: 0.26, envMapIntensity: 1.35 });
      group.add(new THREE.Mesh(bodyGeo, frameMat));

      const backPlate = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(w - 0.04, h - 0.04, Math.max(0.04, radius - 0.02))), backMat);
      backPlate.position.z = -depth / 2 - 0.0345; backPlate.rotation.y = Math.PI;
      const emblem = new THREE.Mesh(new THREE.CircleGeometry(0.14, 28), chromeMat);
      emblem.position.set(0, 0.08, -depth / 2 - 0.036); emblem.rotation.y = Math.PI;
      const bezel = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(w - 0.04, h - 0.04, Math.max(0.04, radius - 0.02))), new THREE.MeshBasicMaterial({ color: 0x020408 }));
      bezel.position.z = depth / 2 + 0.034;
      group.add(backPlate, emblem, bezel);

      const sw = w - 0.095, sh = h - 0.095;
      const screenGeo = new THREE.ShapeGeometry(roundedShape(sw, sh, Math.max(0.03, radius - 0.035)));
      const pos = screenGeo.attributes.position;
      const uvs = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        uvs[i * 2] = (pos.getX(i) + sw / 2) / sw;
        uvs[i * 2 + 1] = (pos.getY(i) + sh / 2) / sh;
      }
      screenGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      const screen = new THREE.Mesh(screenGeo, new THREE.MeshStandardMaterial({
        map: createOLEDTexture(wallpaperPalette, style === 'ultra'),
        emissive: 0x1e40af, emissiveIntensity: 0.25, roughness: 0.05, metalness: 0.08, envMapIntensity: 1.45
      }));
      screen.position.z = depth / 2 + 0.036;
      group.add(screen);

      if (style === 'iphone') {
        const island = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(0.46, 0.115, 0.057)), new THREE.MeshBasicMaterial({ color: 0x010204 }));
        island.position.set(0, h / 2 - 0.19, depth / 2 + 0.038);
        group.add(island);
      } else {
        const punch = new THREE.Mesh(new THREE.CircleGeometry(0.046, 20), new THREE.MeshBasicMaterial({ color: 0x010204 }));
        punch.position.set(0, h / 2 - 0.16, depth / 2 + 0.038);
        group.add(punch);
      }

      const darkHousingMat = new THREE.MeshStandardMaterial({ color: 0x090d16, metalness: 0.75, roughness: 0.28 });
      const arCoatingMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.35, metalness: 0.95, roughness: 0.1 });
      function addCameraBarrel(cx, cy, r, barrelDepth) {
        const bg = new THREE.Group();
        const outerGeo = new THREE.CylinderGeometry(r, r * 1.04, barrelDepth, 28); outerGeo.rotateX(Math.PI / 2);
        const housingGeo = new THREE.CylinderGeometry(r * 0.80, r * 0.80, barrelDepth + 0.005, 24); housingGeo.rotateX(Math.PI / 2);
        const opticGeo = new THREE.CylinderGeometry(r * 0.32, r * 0.32, barrelDepth + 0.011, 20); opticGeo.rotateX(Math.PI / 2);
        bg.add(new THREE.Mesh(outerGeo, frameMat), new THREE.Mesh(housingGeo, darkHousingMat), new THREE.Mesh(opticGeo, arCoatingMat));
        bg.position.set(cx, cy, -depth / 2 - 0.034 - barrelDepth / 2);
        group.add(bg);
      }

      if (style === 'iphone') {
        const plateauGeo = new THREE.ExtrudeGeometry(roundedShape(0.86, 0.88, 0.19), { depth: 0.048, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.014, bevelThickness: 0.014 });
        plateauGeo.center();
        const plateau = new THREE.Mesh(plateauGeo, backMat);
        const px = 0.28, py = h / 2 - 0.56;
        plateau.position.set(px, py, -depth / 2 - 0.052);
        group.add(plateau);
        addCameraBarrel(px + 0.19, py + 0.21, 0.168, 0.095);
        addCameraBarrel(px + 0.19, py - 0.21, 0.168, 0.095);
        addCameraBarrel(px - 0.18, py, 0.168, 0.095);
      } else {
        const gx = 0.44, gy = h / 2 - 0.34;
        addCameraBarrel(gx, gy, 0.16, 0.09);
        addCameraBarrel(gx, gy - 0.37, 0.16, 0.09);
        addCameraBarrel(gx, gy - 0.74, 0.16, 0.09);
        addCameraBarrel(gx - 0.31, gy - 0.18, 0.11, 0.07);
        addCameraBarrel(gx - 0.31, gy - 0.55, 0.11, 0.07);
      }
      return group;
    }

    // 8-Model Pool (Existing 3 Smartphones + 5 IT Devices, Matched to Smartphone Hero Scale)
    const MODEL_POOL = [
      {
        id: 'galaxy', label: 'Galaxy S25 Ultra', baseYaw: 0.56,
        mesh: createSmartphone3D({ w: 1.66, h: 3.44, depth: 0.165, radius: 0.065, frameColor: 0x93c5fd, backColor: 0x1e293b, style: 'ultra', wallpaperPalette: ['#020617', '#0c4a6e', '#082f49', 'rgba(56, 189, 248, 0.92)', 'rgba(14, 165, 233, 0.45)'] })
      },
      {
        id: 'iphone-main', label: 'iPhone 17 Pro Max', baseYaw: 0.0,
        mesh: createSmartphone3D({ w: 1.74, h: 3.58, depth: 0.17, radius: 0.26, frameColor: 0xd6c7b2, backColor: 0x27272a, style: 'iphone', wallpaperPalette: ['#040b1a', '#0a2e6e', '#030712', 'rgba(0, 150, 255, 0.92)', 'rgba(251, 191, 36, 0.42)'] })
      },
      {
        id: 'iphone-blue', label: 'Pro Flagship Blue', baseYaw: -2.46,
        mesh: createSmartphone3D({ w: 1.64, h: 3.40, depth: 0.165, radius: 0.24, frameColor: 0x60a5fa, backColor: 0x0f172a, style: 'iphone', wallpaperPalette: ['#05070a', '#1e1b4b', '#090d16', 'rgba(96, 165, 250, 0.92)', 'rgba(129, 140, 248, 0.45)'] })
      },
      { id: 'laptop',  label: 'MacBook / Galaxy Book', mesh: createLaptopModel(),  baseYaw: 0.28 },
      { id: 'airpods', label: 'AirPods MagSafe Case',  mesh: createAirpodsModel(), baseYaw: -0.35 },
      { id: 'watch',   label: 'Titanium Smartwatch',   mesh: createWatchModel(),   baseYaw: 0.32 },
      { id: 'headset', label: 'AirPods Max Headset',   mesh: createHeadsetModel(), baseYaw: -0.25 },
      { id: 'tablet',  label: 'iPad Pro + Pencil Pro', mesh: createTabletModel(),  baseYaw: 0.22 }
    ];

    // 3 Trophy Slots (Left, Center, Right — Exact ide.html Spacing)
    const SLOT_CONFIG = [
      { x: -2.45, baseY: -0.05, z: -0.15, tiltZ: 0.05,  delay: 0.00, chipId: 'chip0', prefix: 'LEFT' },
      { x:  0.00, baseY:  0.34, z:  0.55, tiltZ: 0.00,  delay: 0.10, chipId: 'chip1', prefix: 'CENTER' },
      { x:  2.45, baseY: -0.05, z: -0.15, tiltZ: -0.05, delay: 0.20, chipId: 'chip2', prefix: 'RIGHT' }
    ];

    const slots = SLOT_CONFIG.map(cfg => {
      const group = new THREE.Group();
      group.position.set(cfg.x, cfg.baseY, cfg.z);
      trophyGroup.add(group);
      return { cfg, group, item: null, scale: 0, phase: 'in', timer: 0 };
    });

    let currentIds = [];
    let pendingItems = null;
    let isTransitioning = false;
    let autoSwitch = true;

    function pickRandomThree() {
      const indices = MODEL_POOL.map((_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      const picked = indices.slice(0, 3).map(i => MODEL_POOL[i]);
      const nextKey = picked.map(p => p.id).join(',');
      if (nextKey === currentIds.join(',')) return pickRandomThree();
      return picked;
    }

    function assignTrioImmediate(items) {
      currentIds = items.map(it => it.id);
      slots.forEach((slot, i) => {
        while (slot.group.children.length) slot.group.remove(slot.group.children[0]);
        slot.item = items[i];
        slot.group.add(items[i].mesh);
        slot.scale = 0.001;
        slot.phase = 'in';
        slot.timer = -slot.cfg.delay;
        document.getElementById(slot.cfg.chipId).textContent = `${slot.cfg.prefix}: ${items[i].label}`;
      });
    }

    function triggerRandomSwap() {
      if (isTransitioning) return;
      pendingItems = pickRandomThree();
      isTransitioning = true;
      slots.forEach(slot => {
        slot.phase = 'out';
        slot.timer = -slot.cfg.delay * 0.6;
      });
    }

    // Initial Trio: Existing 3 Smartphones -> then Random 3 of 8
    assignTrioImmediate([MODEL_POOL[0], MODEL_POOL[1], MODEL_POOL[2]]);

    let autoTimer = setInterval(() => {
      if (autoSwitch) triggerRandomSwap();
    }, 4500);

    document.getElementById('nextTrioBtn').addEventListener('click', triggerRandomSwap);
    const pauseBtn = document.getElementById('pauseBtn');
    pauseBtn.addEventListener('click', () => {
      autoSwitch = !autoSwitch;
      pauseBtn.textContent = autoSwitch ? '자동전환 ON' : '자동전환 PAUSE';
    });

    // Resize
    function resize() {
      const rect = stageEl.getBoundingClientRect();
      const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.position.z = w < 760 ? 12.2 : 9.6;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stageEl);
    resize();

    // Drag Rotate + Pointer Parallax
    let dragging = false, prevX = 0, userYaw = 0, targetYaw = 0, ptrX = 0, ptrY = 0;
    stageEl.addEventListener('pointerdown', e => { dragging = true; prevX = e.clientX; });
    window.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('pointermove', e => {
      const rect = stageEl.getBoundingClientRect();
      ptrX = ((e.clientX - rect.left) / Math.max(1, rect.width) - 0.5) * 2;
      ptrY = ((e.clientY - rect.top) / Math.max(1, rect.height) - 0.5) * 2;
      if (dragging) {
        targetYaw += (e.clientX - prevX) * 0.012;
        prevX = e.clientX;
      }
    }, { passive: true });

    // Smooth Cubic Ease
    const easeOutBack = t => 1 + 2.1 * Math.pow(t - 1, 3) + 1.1 * Math.pow(t - 1, 2);
    const easeInCubic = t => t * t * t;

    const fpsEl = document.getElementById('fpsCounter');
    let frames = 0, lastFps = performance.now(), lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const t = now * 0.001;

      frames++;
      if (now - lastFps >= 500) {
        fpsEl.textContent = `${Math.round((frames * 1000) / (now - lastFps))} FPS`;
        frames = 0; lastFps = now;
      }

      userYaw += (targetYaw - userYaw) * 0.08;

      let outDoneCount = 0;
      slots.forEach((slot, i) => {
        const cfg = slot.cfg;
        let slideOffset = 0;
        let spinBoost = 0;

        if (slot.phase === 'out') {
          slot.timer += dt;
          if (slot.timer > 0) {
            const p = Math.min(1, slot.timer / 0.38);
            slot.scale = Math.max(0.001, 1 - easeInCubic(p));
            slideOffset = -0.55 * easeInCubic(p);
            spinBoost = 0.85 * easeInCubic(p);
            if (p >= 1) outDoneCount++;
          }
        } else if (slot.phase === 'in') {
          slot.timer += dt;
          if (slot.timer > 0) {
            const p = Math.min(1, slot.timer / 0.52);
            slot.scale = Math.max(0.001, easeOutBack(p));
            slideOffset = (1 - Math.min(1, p * 1.15)) * 0.48;
            spinBoost = (1 - Math.min(1, p)) * -0.75;
            if (p >= 1) slot.phase = 'idle';
          }
        } else {
          slot.scale = 1;
        }

        slot.group.scale.setScalar(slot.scale);
        slot.group.position.y = cfg.baseY + Math.sin(t * 1.5 + i * 1.3) * 0.09 + slideOffset;
        slot.group.rotation.y = (slot.item ? slot.item.baseYaw : 0) + Math.sin(t * 0.72 + i * 0.9) * 0.42 + userYaw + ptrX * 0.20 + spinBoost;
        slot.group.rotation.x = Math.cos(t * 0.65 + i) * 0.05 - ptrY * 0.08;
        slot.group.rotation.z = cfg.tiltZ;
      });

      if (isTransitioning && outDoneCount === 3 && pendingItems) {
        const nextItems = pendingItems;
        pendingItems = null;
        isTransitioning = false;
        assignTrioImmediate(nextItems);
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
